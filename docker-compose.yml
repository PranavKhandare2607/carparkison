services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcai
      POSTGRES_PASSWORD: pcai
      POSTGRES_DB: pcai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcai -d pcai"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://pcai:pcai@db:5432/pcai
    depends_on:
      db:
        condition: service_healthy
    command: ["pnpm", "--filter", "@workspace/db", "run", "push-force"]
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pcai:pcai@db:5432/pcai
      SESSION_SECRET: local-dev-session-secret-change-me
      DEMO_PASSWORD: demo12345
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
